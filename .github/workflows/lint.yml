name: Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# El job solo lee el código: no crea releases, no empuja nada, no comenta.
# Sin este bloque, el GITHUB_TOKEN hereda el permiso por defecto del
# repositorio, que en repositorios creados antes de feb-2023 es de escritura
# sobre todos los scopes.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      # persist-credentials: false — por defecto, checkout deja el
      # GITHUB_TOKEN escrito en .git/config, y el paso siguiente (`npm ci`)
      # ejecuta los scripts de ciclo de vida de un árbol de ~1650 paquetes de
      # terceros. Ningún paso posterior necesita credenciales de git.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Sin --ignore-scripts (a diferencia de lo documentado originalmente en
      # ADR-0014/D-11): vue-cli-plugin-electron-builder hace
      # require('electron') a nivel de módulo al cargarse — lo ejecuta
      # vue-cli-service para CUALQUIER comando, lint incluido, no solo
      # electron:build. Sin el postinstall propio de electron (que descarga
      # el binario y escribe node_modules/electron/path.txt), ese require
      # lanza antes de que ESLint corra. Verificado en un entorno Linux
      # equivalente a este runner: npm ci a secas (con scripts) termina en
      # ~12s y electron-builder install-app-deps no falla con
      # active-win@8.2.1 — la premisa de que ese postinstall es
      # "costoso/roto en Linux" no se sostuvo contra el código real.
      - run: npm ci

      - run: npm run lint -- --no-fix
