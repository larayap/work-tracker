<!-- Icono del módulo Pomodoro — tomate temporizador dibujado a medida.
     Tabler Icons no incluye un tomate, así que este conserva la identidad Pomodoro del
     artwork original (`pomodoro_worktracker.webp`), incluida la escala graduada del dial,
     retrazada en la misma grilla 24×24 que `icon-manual.svg` e `icon-work.svg`.

     A diferencia de esos dos, este va relleno y no de trazo, y es la única forma en que la
     escala sobrevive a 24 px: dibujada con líneas, la banda horizontal y sus marcas se
     funden entre sí y con el contorno, y el conjunto lee como una boca con dientes. Acá la
     banda y las marcas son huecos reales del relleno —un único path con `fill-rule="evenodd"`,
     donde los subpaths anidados alternan hueco y macizo—, así que se recortan con el máximo
     contraste posible y siguen leyéndose sobre cualquier fondo, incluido el #6f6f6f de la
     tarjeta activa. Pintarlos del color del fondo, en cambio, los rompería justo ahí.

     Geometría: cuerpo centrado en (12, 15.5), corrido hacia abajo para abrir aire arriba.
     La banda cruza el cuerpo de lado a lado y las tres marcas suben desde su borde inferior.
     Encima, dos hojas macizas y el tallo curvo, que apoyan en el borde superior sin cruzarlo.

     El relleno va fijo en blanco porque el icono se consume vía <img>, que no hereda
     `currentColor` del CSS del componente. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <path fill="#ffffff" fill-rule="evenodd" d="M12 9.6a7.2 5.9 0 1 0 0 11.8a7.2 5.9 0 1 0 0 -11.8Z M4.4 14.4h15.2v2.5h-15.2Z M7.8 15.3h1.9v1.6h-1.9Z M11.1 15.3h1.9v1.6h-1.9Z M14.4 15.3h1.9v1.6h-1.9Z" />
  <path fill="#ffffff" d="M11.2 9.2c-.5 -2 -2.4 -3.4 -4.8 -3.3c.2 2 1.7 3.4 3.9 3.6Z" />
  <path fill="#ffffff" d="M12.8 9.2c.5 -2 2.4 -3.4 4.8 -3.3c-.2 2 -1.7 3.4 -3.9 3.6Z" />
  <path fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" d="M12 9.1c-.3 -1.8 .3 -3 1.6 -3.9" />
</svg>
