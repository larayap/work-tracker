<!-- Icono del módulo Pomodoro — tomate temporizador dibujado a medida.
     Tabler Icons no incluye un tomate, así que este conserva la identidad Pomodoro del
     artwork original (`pomodoro_worktracker.webp`), incluida la escala graduada del dial,
     retrazada en la misma grilla 24×24 que `icon-manual.svg` e `icon-work.svg`.

     A diferencia de esos dos, este va relleno y no de trazo, y es la única forma en que la
     escala sobrevive a 24 px: dibujada con líneas, la banda horizontal y sus marcas se
     funden entre sí y con el contorno, y el conjunto lee como una boca con dientes. Acá la
     banda y las marcas son huecos reales del relleno —un único path con `fill-rule="evenodd"`,
     donde los subpaths anidados alternan hueco y macizo—, así que se recortan con el máximo
     contraste posible y siguen leyéndose sobre cualquier fondo, incluido el #6f6f6f de la
     tarjeta activa. Pintarlos del color del fondo, en cambio, los rompería justo ahí.

     Geometría: cuerpo centrado en (12, 14.9), con radios 6.7 × 5.5 que dejan margen contra
     el borde del lienzo — el mismo aire que se reservan los dos iconos de trazo, para que las
     tres tarjetas pesen igual. La ranura del dial queda contenida dentro del cuerpo y no lo
     cruza de lado a lado: al llegar al contorno lo parte en dos, y en los extremos quedan dos
     puntas sueltas que el ojo lee como astillas, no como un tomate. De su borde inferior
     suben tres marcas: la central, más alta y más ancha, hace de indicador del dial y es la
     que sostiene la lectura de «temporizador» cuando las laterales se empiezan a perder.
     Encima, dos hojas macizas y el tallo curvo, que apoyan en el borde superior sin cruzarlo.

     El relleno va fijo en blanco porque el icono se consume vía <img>, que no hereda
     `currentColor` del CSS del componente. -->
<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <path fill="#ffffff" fill-rule="evenodd" d="M12 9.4a6.7 5.5 0 1 0 0 11a6.7 5.5 0 1 0 0 -11Z M7 13.7h10v2.4h-10Z M8.2 14.9h1.5v1.2h-1.5Z M11.1 14.1h1.8v2h-1.8Z M14.3 14.9h1.5v1.2h-1.5Z" />
  <path fill="#ffffff" d="M11.3 9.1c-.45 -1.85 -2.2 -3.15 -4.4 -3.05c.18 1.85 1.55 3.15 3.6 3.35Z" />
  <path fill="#ffffff" d="M12.7 9.1c.45 -1.85 2.2 -3.15 4.4 -3.05c-.18 1.85 -1.55 3.15 -3.6 3.35Z" />
  <path fill="none" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" d="M12 9c-.3 -1.7 .3 -2.8 1.5 -3.6" />
</svg>
